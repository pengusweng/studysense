# Local Postgres for the API's event log (api/README.md, "Local database").
# Host port 6000, so it doesn't collide with a Postgres already on 5432.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: studysense
      POSTGRES_PASSWORD: studysense
      POSTGRES_DB: studysense
    ports:
      - "6000:5432"
    volumes:
      - studysense-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studysense -d studysense"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  studysense-db:
